<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Гра-клікер: Натисни якнайшвидше!</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Гра-клікер: Натисни якнайшвидше!</h1>
      <p class="subtitle">Твій рекорд: <span id="bestScore">0</span> очок</p>
    </header>

    <section class="game" aria-label="Гральна зона">
      <div class="panel">
        <div class="info">
          <div class="stat">
            <span class="label">Час</span>
            <span id="timer" class="value">10.0</span>
          </div>
          <div class="stat">
            <span class="label">Очки</span>
            <span id="score" class="value">0</span>
          </div>
        </div>

        <button id="clickButton" class="click-button" disabled>
          Натисни мене!
        </button>

        <button id="startButton" class="start-button">
          Почати гру
        </button>

        <div id="message" class="message" aria-live="polite"></div>
      </div>

      <div id="confetti" class="confetti"></div>
    </section>

    <footer class="footer">
      <p>Гра створена HTML, CSS, JavaScript. Натискай кнопку якнайшвидше!</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
